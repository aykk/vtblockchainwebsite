name: Run Dune Queries

on:
  schedule:
    # Run weekly on Sundays at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:
    # Allow manual trigger

jobs:
  run-dune-queries:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dune CLI
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
        run: |
          # Install Dune CLI from the correct repo
          curl -sSfL https://github.com/duneanalytics/cli/raw/main/install.sh | bash
          echo "$HOME/.dune/bin" >> $GITHUB_PATH
          dune --version

      - name: Run Stablecoin Marketcap Query
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
        run: |
          echo "Running marketcap query..."
          SQL=$(cat data/dune-scripts/stablecoin-marketcap.sql)
          dune query run-sql --sql "$SQL" -o json > data/dune-scripts/stablecoin-marketcap.sql
          echo "Results saved to data/marketcap-results.json"

      - name: Run Stablecoin Transfers Query
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
        run: |
          echo "Running transfers query..."
          SQL=$(cat data/dune-scripts/stablecoin-total-transfers.sql)
          dune query run-sql --sql "$SQL" -o json > data/dune-scripts/stablecoin-total-transfers.sql
          echo "Results saved to data/transfers-results.json"

      - name: Commit and push results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Dune query results [skip ci]"
            git push
          fi
